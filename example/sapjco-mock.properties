# Simulated SAP system for the sapjco3 mock
# Activate it with -Dsapjco.mock.config=<path to this file> or the environment variable SAPJCO_MOCK_CONFIG
# Changes are picked up without restart.

# Message server (load balancing): jco.client.mshost, jco.client.r3name, jco.client.group (optional jco.client.msserv)
system.r3name=MCK
system.mshost=sapms.mock.local
# msserv can be given as port or as service name sapms<R3NAME>
system.msserv=3600
system.groups=PUBLIC,SPACE

# Application server (direct): jco.client.ashost, jco.client.sysnr
system.ashost=sapapp.mock.local
system.sysnr=00

# Available clients (Mandanten)
system.clients=100,200

# Users: user.<NAME>.password (case-sensitive), user.<NAME>.locked
# user names are case-insensitive like in SAP
user.TESTUSER.password=Test1234!
user.LOCKED.password=Locked1234!
user.LOCKED.locked=true

# Directory with the table files <TABLE>.csv, relative to this file
tables.dir=tables

# Simulation
# delay for every function call
#execute.delayMillis=0
# delay per table, e.g. to test the keep-alive output of the proxy
table.ZSLOW.delayMillis=5000
# error per table: <KEY>:<message>. RFC_READ_TABLE keys (TABLE_NOT_AVAILABLE, NOT_AUTHORIZED, ...) are raised as AbapException,
# all other keys as JCoException with group JCO_ERROR_SYSTEM_FAILURE (like a short dump)
table.ZDUMP.error=SYSTEM_FAILURE:Simulated short dump TSV_TNEW_PAGE_ALLOC_FAILED
table.ZNOAUTH.error=NOT_AUTHORIZED:No authorization for table ZNOAUTH
# delay and error: an error after the proxy has already sent keep-alive output
table.ZSLOWDUMP.delayMillis=5000
table.ZSLOWDUMP.error=SYSTEM_FAILURE:Simulated short dump after a long runtime
